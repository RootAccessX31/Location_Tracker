<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Location Dashboard (Google Maps)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; margin: 0; padding: 0; }
        body { margin: 0; }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
    // Initialize map centered on India (Latitude, Longitude)
    const map = L.map('map').setView([20.5937, 78.9629], 5);

    // Load Google Maps Streets layer
    const googleStreets = L.tileLayer('http://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
        attribution: 'Map data &copy; <a href="https://www.google.com/maps">Google Maps</a>'
    }).addTo(map);

    const markers = {};
    const socket = io();

    function updateMarker(data) {
        const { userId, latitude, longitude } = data;
        
        if (markers[userId]) {
            markers[userId].setLatLng([latitude, longitude]);
        } else {
            markers[userId] = L.marker([latitude, longitude])
                .addTo(map)
                .bindPopup(`User: <b>${userId}</b>`);
            map.setView([latitude, longitude], 15);
        }
    }

    socket.on('initialLocations', (locations) => {
        Object.values(locations).forEach(updateMarker);
    });

    socket.on('locationUpdate', (data) => {
        updateMarker(data);
    });
</script>
</body>
</html>
